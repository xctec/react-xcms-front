<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XCMS · 管理后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var brand = localStorage.getItem('xcms-brand') || 'indigo';
          document.documentElement.setAttribute('data-brand', brand);
          var theme = localStorage.getItem('xcms-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      @keyframes xcms-spin { to { transform: rotate(360deg); } }
      .xcms-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; z-index: 9999; }
      .xcms-boot .ring { width: 40px; height: 40px; border: 4px solid #eef2ff; border-top-color: #6366f1; border-radius: 50%; animation: xcms-spin .8s linear infinite; }
      .xcms-boot .tip { margin: 0; font-size: 14px; color: #64748b; }
      .dark .xcms-boot { background: #0b1020; }
      .dark .xcms-boot .tip { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="xcms-boot">
        <div class="ring"></div>
        <p class="tip">正在加载 XCMS…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
